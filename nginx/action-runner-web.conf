# Nginx Virtual Host Configuration for ActionRunner
# Domain: hook.lma1980.duckdns.org
#
# Proxies Web UI static assets and routes API/card/badge/webhook traffic to ActionRunner-rs

# Rate limit zone: protects webhook endpoint from traffic bursts / DoS
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=5r/s;

server {
    listen 80;
    server_name hook.lma1980.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hook.lma1980.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/hook.lma1980.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hook.lma1980.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval';" always;

    # Root for Leptos WebAssembly SPA distribution files
    # Defaults to action-runner service path, fallback to lma1980
    root /var/lib/action-runner/web/dist;
    index index.html;

    # 1. ActionRunner-rs Webhook Ingress (Rate limited, body restricted to 2M)
    location /webhook {
        limit_req zone=webhook_limit burst=10 nodelay;
        client_max_body_size 2M;

        proxy_pass http://127.0.0.1:8000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. REST API & Queue Monitor Endpoints
    location ~ ^/(api|queue|health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Dynamic Factory Scorecards & Badges
    location ~ ^/(cards|badges)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600, s-maxage=3600";
    }

    # 4. Jobs API fallback & Web UI routing
    # When request specifically accepts JSON, pass through to ActionRunner-rs
    location /jobs {
        if ($http_accept ~* "application/json") {
            proxy_pass http://127.0.0.1:8000;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # 5. Leptos SPA Static Assets & HTML5 History Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
