<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ActionRunner-rs • Queue Monitor &amp; Factory Pipeline</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <script type="module">
      import init from './action-runner-web.js';
      init('./action-runner-web_bg.wasm').catch(err => {
        console.error("Failed to initialize ActionRunner-web Leptos WASM:", err);
        document.body.innerHTML = `
          <div style="padding: 30px; font-family: sans-serif; color: #ff7b72; background: #0d1117;">
            <h2>ActionRunner-web Initialization Error</h2>
            <pre>${err}</pre>
          </div>
        `;
      });
    </script>
  </body>
</html>
