version: "2"
name: "ActionRunner-web Factory Pipeline: Hygiene, Tests, Coverage & WASM Build"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: audit-check
    name: "Verify Dependencies Security Advisories"
    tags: ["audit"]
    threads: 2
    run: "cargo audit"

  - id: coverage-test
    name: "Evaluate Test Suite & Line Code Coverage"
    tags: ["test"]
    depends_on: ["fmt-check", "clippy-check"]
    threads: 4
    run: "cargo llvm-cov --summary-only"

  - id: wasm32-build
    name: "Validate WASM32 Release Compilation"
    tags: ["build"]
    depends_on: ["fmt-check", "clippy-check"]
    threads: 4
    run: "cargo build --target wasm32-unknown-unknown --release"
