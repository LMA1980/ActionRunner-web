version: "2"
name: "ActionRunner-web Release Tag Validation"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: wasm32-build
    name: "Validate WASM32 Release Compilation"
    tags: ["build"]
    depends_on: ["fmt-check", "clippy-check"]
    threads: 4
    run: "cargo build --target wasm32-unknown-unknown --release"
