      import init from './action-runner-web.js?v=3af54f33c1';
      init('./action-runner-web_bg.wasm?v=3af54f33c1').catch(err => {
        console.error("Failed to initialize ActionRunner-web Leptos WASM:", err);
        const container = document.createElement('div');
        container.style.cssText = 'padding: 30px; font-family: sans-serif; color: #ff7b72; background: #0d1117;';
        const heading = document.createElement('h2');
        heading.textContent = 'ActionRunner-web Initialization Error';
        const pre = document.createElement('pre');
        pre.textContent = String(err);
        container.appendChild(heading);
        container.appendChild(pre);
        document.body.appendChild(container);
      });
    </script>
