[package]
name = "action-runner-web"
version = "0.1.0"
edition = "2021"
description = "Leptos WASM Queue Monitor & Job Drill-Down Web UI for ActionRunner-rs on SpacemiT K3"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/ActionRunner-web"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http", "eventsource"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Location",
    "History",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Element",
    "HtmlElement",
    "HtmlPreElement",
    "Event",
    "EventSource",
    "MessageEvent",
    "Navigator",
    "Clipboard",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
