[build]
target = "index.html"
dist = "dist"
public_url = "/"

[serve]
addresses = ["127.0.0.1"]
port = 8080

[[proxy]]
backend = "http://127.0.0.1:8000/api"
rewrite = "/api"

[[proxy]]
backend = "http://127.0.0.1:8000/cards"
rewrite = "/cards"

[[proxy]]
backend = "http://127.0.0.1:8000/badges"
rewrite = "/badges"
