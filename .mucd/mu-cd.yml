version: "1"
service: "mu-ci-web"

target_nodes:
  - "node-a"
  - "node-b"

lease_ttl_seconds: 300
warmup_timeout_seconds: 30
bake_window_seconds: 60
max_error_logs: 0
max_p99_latency_ms: 250.0
integration_tests: "all"

deployment:
  target_nodes:
    - "node-a"
    - "node-b"
  web_root: "/var/www/mu-ci-web"
  artifact: "dist"

verification:
  bake_window_secs: 60
  rollback_on_failure: true
